[workspace]
members = [
    "crates/lumen-lexer",
    "crates/lumen-parser",
    "crates/lumen-sema",
    "crates/lumen-ir",
    "crates/lumen-codegen",
    "crates/lumen-vm",
    "crates/lumen-cli",
    "crates/lumen-fmt",
    "crates/lumen-repl",
    "crates/lumen-project",
    "crates/lumen-aot",
    "crates/lumen-lsp",
    "crates/lumen-doc",
    "crates/lumen-pkg",
    "crates/lumen-bench",
    "crates/lumen-plugin",
    "crates/lumen-wasm",
    "crates/lumen-api",
]
resolver = "2"

[workspace.package]
version = "3.84.4"
edition = "2021"
authors = ["Omar Palomares Velasco <trixxo@corp>"]
license = "GPL-3.0"
repository = "https://github.com/omarPVP123131/Lumen"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = "debuginfo"
incremental = false

[profile.dev]
opt-level = 0
incremental = true

[profile.bench]
inherits = "release"
debug = true

# Perfil perf: máximo rendimiento para benchmarks AOT/Cranelift
[profile.perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false
strip = "symbols"



