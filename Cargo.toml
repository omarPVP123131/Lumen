[workspace]
members = [
    "crates/lumen-lexer",
    "crates/lumen-parser",
    "crates/lumen-sema",
    "crates/lumen-ir",
    "crates/lumen-codegen",
    "crates/lumen-vm",
    "crates/lumen-cli",
    "crates/lumen-fmt",
    "crates/lumen-repl",
    "crates/lumen-project",
    "crates/lumen-aot",
    "crates/lumen-lsp",
    "crates/lumen-doc",
    "crates/lumen-pkg",
    "crates/lumen-bench",
    "crates/lumen-plugin",
    "crates/lumen-wasm",
    "crates/lumen-api",
]
resolver = "2"

[workspace.package]
version = "3.4.1"
edition = "2021"
authors = ["Omar Palomares Velasco <trixxo@corp>"]
license = "MIT"
repository = "https://github.com/omarPVP123131/Lumen"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"



