[package]
name = "lumen-pkg"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Package manager para LÚMEN — lumen install, dependencias, registry"
keywords = ["lumen", "language", "package", "manager", "install"]

[[bin]]
name = "lumen-pkg"
path = "src/main.rs"

[lib]
name = "lumen_pkg"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# BUG-145: el "Checksum SHA-256" que publish mostraba era un DefaultHasher
# (SipHash de 64 bits), no SHA-256.
sha2 = "0.10"
