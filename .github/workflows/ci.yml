name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all -- -D warnings

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets --verbose
      - run: cargo test --all --verbose -- --skip test_aes

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets --verbose
      - run: cargo test --all --verbose -- --skip test_aes

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets --verbose
      - run: cargo test --all --verbose

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p lumen-wasm --target wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: cargo check -p lumen-wasm --target wasm32-wasip1 --no-default-features --features wasi

  # ── AUTOTAG ─────────────────────────────────────────────
  # Crea el tag v<version> (desde VERSION) SOLO cuando:
  #   • es un push a master/main (no PR)
  #   • todos los checks de calidad pasaron
  #   • el tag aún no existe en el remoto
  # build/release dependen de este job (needs), así que el
  # pipeline completo corre en el MISMO workflow (evita la
  # limitación de que GITHUB_TOKEN no dispara nuevos runs).
  autotag:
    name: Autotag v<version>
    needs: [fmt, clippy, linux, macos, windows, wasm-check]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.push.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT
      - name: Check tag on remote
        id: check
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create and push tag
        id: push
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }} (autotag — todos los checks de CI pasaron)"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "created=true" >> $GITHUB_OUTPUT
      - name: Log
        if: always()
        run: |
          echo "TAG=${{ steps.version.outputs.tag }} (exists=${{ steps.check.outputs.exists }})"
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "El tag ya existe — se reutiliza para build/release."
          fi

  # ── BUILD (4 targets) ───────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: autotag
    if: needs.autotag.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare asset
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mkdir -p lumen-${{ matrix.target }}
          cp lumen${{ matrix.ext }} lumen-${{ matrix.target }}/
          cp ../../../README.md lumen-${{ matrix.target }}/
          cp ../../../CHANGELOG.md lumen-${{ matrix.target }}/
          cp ../../../LICENSE* lumen-${{ matrix.target }}/ 2>/dev/null || true
          cp ../../../VERSION lumen-${{ matrix.target }}/ 2>/dev/null || true
          # Include stdlib, examples, and web playground for complete development environment
          cp -r ../../../stdlib lumen-${{ matrix.target }}/
          cp -r ../../../examples lumen-${{ matrix.target }}/
          cp -r ../../../crates/lumen-wasm/web lumen-${{ matrix.target }}/
          # Copy WASM pkg for web playground
          cp -r ../../../crates/lumen-wasm/pkg lumen-${{ matrix.target }}/ 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip ../../../lumen-${{ matrix.target }}.zip lumen-${{ matrix.target }}/
          else
            tar czf ../../../lumen-${{ matrix.target }}.tar.gz lumen-${{ matrix.target }}/
          fi
      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.target }}
          path: lumen-${{ matrix.target }}.*
          retention-days: 30

  # ── RELEASE ─────────────────────────────────────────────
  # Crea/actualiza la GitHub Release asociada al tag que
  # autotag garantizó. Corre solo tras build exitoso.
  release:
    name: Create GitHub Release
    needs: [autotag, build]
    if: always() && needs.autotag.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract changelog section
        run: |
          TAG="${{ needs.autotag.outputs.tag }}"
          VER="${TAG#v}"
          echo "Notas para v$VER..."
          awk -v ver="$VER" '/^## / { if (found) exit; if ($0 ~ "v" ver || $0 ~ ver) found=1; next } found' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release LÚMEN v$VER — autotag tras CI verde (fmt, clippy -D warnings, tests 3 OS, wasm)." > release_notes.md
            echo "" >> release_notes.md
            echo "Assets multi-plataforma (linux/macos/windows x64, macos arm64) incluidos." >> release_notes.md
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.autotag.outputs.tag }}
          name: LÚMEN ${{ needs.autotag.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}