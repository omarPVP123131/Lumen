name: ⚡ LÚMEN CI/CD & QA — Distribución Profesional

# ─── Concurrencia: cancela runs previos del mismo branch ─────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8
  RUST_BACKTRACE: 1

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # 1. CALIDAD BASE · Formato, Linter, Docs, Seguridad
  # ═════════════════════════════════════════════════════════════════════════════
  fmt:
    name: 🎨 Format (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check

  clippy:
    name: 🔍 Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all -- -D warnings

  docs-check:
    name: 📚 Docs (manuales y guías)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estructura docs/
        run: |
          set -e
          echo "=== Estructura docs/ ==="
          ls -R docs | head -n 100
          test -f docs/README.md || (echo "❌ docs/README.md faltante" && exit 1)
          test -f docs/guias/GUIA_RAPIDA_UX.md || (echo "❌ GUIA_RAPIDA_UX faltante" && exit 1)
          test -f docs/guias/CURRICULUM_7_DIAS.md || (echo "❌ CURRICULUM faltante" && exit 1)
          test -f docs/guias/LIBRO_OFICIAL_LUMEN.md || (echo "❌ LIBRO faltante" && exit 1)
          test -f docs/referencia/cli.md || (echo "❌ cli.md faltante" && exit 1)
          test -f docs/spec/vm-spec.md || (echo "❌ vm-spec faltante" && exit 1)
          test -f docs/informes/AUDITORIA_CONSOLIDADA.md || echo "⚠️ AUDITORIA_CONSOLIDADA no encontrada (opcional)"
          echo "✅ docs/ completa: guias + referencia + arquitectura + spec + informes"

      - name: Validar enlaces y formato Markdown
        run: |
          # Valida que ningún .md esté vacío y que tengan encabezado
          for f in docs/**/*.md docs/*.md; do
            [ -f "$f" ] || continue
            lines=$(wc -l < "$f")
            if [ "$lines" -lt 3 ]; then echo "⚠️ $f muy corto ($lines líneas)"; fi
          done
          echo "✅ Markdown validado"

  security:
    name: 🔒 Security Audit (cargo audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Run cargo audit
        run: cargo audit 2>&1 | tail -n 50 || true
      - name: Cargo deny (licencias)
        run: |
          cargo install cargo-deny --locked || true
          cargo deny check licenses 2>&1 | tail -n 30 || true

  # ═════════════════════════════════════════════════════════════════════════════
  # 2. PRUEBAS MULTIPLATAFORMA · Linux / Windows / macOS / Termux
  # ═════════════════════════════════════════════════════════════════════════════
  linux-test:
    name: 🐧 Tests (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Workspace Tests
        run: cargo test --workspace --verbose
      - name: Validate All LÚMEN Examples
        run: cargo run --bin lumen -- check examples
      - name: Gate 0 crashes / 0 fails (Linux)
        run: |
          cargo build --release --bin lumen
          python scripts/ci_gate.py --lumen target/release/lumen --stdlib stdlib --examples examples --timeout 8 --workers 4

  windows-test:
    name: 🪟 Tests (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --verbose
      - name: Validate All LÚMEN Examples
        run: cargo run --bin lumen -- check examples
      - name: Gate 0 crashes / 0 fails (Windows)
        run: |
          cargo build --release --bin lumen
          python scripts/ci_gate.py --lumen target/release/lumen.exe --stdlib stdlib --examples examples --timeout 8 --workers 4

  macos-test:
    name: 🍎 Tests (macOS ARM64)
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Validate All LÚMEN Examples
        run: cargo run --bin lumen -- check examples
      - name: Gate smoke (macOS)
        run: |
          cargo build --release --bin lumen
          ./target/release/lumen check examples

  termux-check:
    name: 📱 Termux / Android (cross)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked || true
      - name: Cross-build Termux aarch64
        run: cross build --release --target aarch64-linux-android --bin lumen
      - name: Validate Termux binary
        run: |
          file target/aarch64-linux-android/release/lumen || true
          aarch64-linux-gnu-readelf -h target/aarch64-linux-android/release/lumen 2>&1 | head -n 20 || true
          ls -lh target/aarch64-linux-android/release/lumen
          echo "✅ Termux aarch64 binario generado correctamente"
      - name: Empaquetado Termux smoke (con docs)
        run: |
          mkdir -p /tmp/termux_smoke/docs
          cp target/aarch64-linux-android/release/lumen /tmp/termux_smoke/ || true
          cp -r docs/* /tmp/termux_smoke/docs/ 2>/dev/null || true
          cp README.md CHANGELOG.md LICENSE VERSION info.md /tmp/termux_smoke/ 2>/dev/null || true
          ls -R /tmp/termux_smoke | head -n 80
          test -f /tmp/termux_smoke/docs/guias/GUIA_RAPIDA_UX.md && echo "✅ Manuales en paquete Termux"
          test -f /tmp/termux_smoke/docs/referencia/cli.md && echo "✅ Guías CLI en paquete Termux"

  wasm-check:
    name: 🌐 WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p lumen-wasm --target wasm32-unknown-unknown
      - run: cargo check -p lumen-wasm --target wasm32-wasip1 --no-default-features --features wasi

  headless-check:
    name: 🖥️ Headless (LUMEN_HEADLESS=1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUMEN_HEADLESS: 1
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests (headless)
        run: cargo test --workspace --verbose
      - name: Check 389+ examples (headless)
        run: cargo run --bin lumen -- check examples
      - name: Production suite (headless)
        run: cargo test --test production -- --nocapture
      - name: Bench smoke (headless)
        run: cargo bench -p lumen-bench -- --quick 2>&1 | head -n 30

  gate:
    name: 🚪 Gate 0 crashes / 0 fails (empaquetado)
    runs-on: ubuntu-latest
    needs: [linux-test, headless-check]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release artifact
        run: cargo build --release --bin lumen
      - name: Assemble minimal package (como release) con docs
        run: |
          mkdir -p /tmp/pkg
          cp target/release/lumen /tmp/pkg/lumen
          cp -r stdlib /tmp/pkg/stdlib
          cp -r examples /tmp/pkg/examples
          mkdir -p /tmp/pkg/docs && cp -r docs/* /tmp/pkg/docs/ 2>/dev/null || true
          cp README.md CHANGELOG.md LICENSE VERSION info.md /tmp/pkg/ 2>/dev/null || true
          chmod +x /tmp/pkg/lumen
          ls -lh /tmp/pkg/
          test -f /tmp/pkg/docs/guias/GUIA_RAPIDA_UX.md && echo "✅ docs/guias presente en pkg"
          test -f /tmp/pkg/docs/referencia/cli.md && echo "✅ docs/referencia presente"
      - name: Run gate sobre artefacto empaquetado
        run: python scripts/ci_gate.py --lumen /tmp/pkg/lumen --stdlib /tmp/pkg/stdlib --examples /tmp/pkg/examples --timeout 8 --workers 4

  sanitizer-check:
    name: 🧪 ASan/UBSan (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: ASan + UBSan (runtime VM)
        env:
          RUSTFLAGS: "-Z sanitizer=address,undefined -C force-frame-pointers=yes"
          RUSTDOCFLAGS: "-Z sanitizer=address,undefined"
        run: cargo test -p lumen-vm --lib --target x86_64-unknown-linux-gnu -- --nocapture 2>&1 | tail -n 20
      - name: LeakSan optional
        env:
          RUSTFLAGS: "-Z sanitizer=leak"
        run: cargo test -p lumen-vm --lib --target x86_64-unknown-linux-gnu 2>&1 | tail -n 20 || true

  fuzz-smoke:
    name: 🔀 Fuzz smoke (5s)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true
      - name: Fuzz VM (5s por target)
        run: |
          if [ -d crates/lumen-vm/fuzz ]; then
            cargo fuzz run fuzz_vm -- -max_total_time=5 2>&1 | tail -n 20 || true
            cargo fuzz run fuzz_ffi -- -max_total_time=5 2>&1 | tail -n 20 || true
          else
            echo "fuzz harnesses no presentes"
            ls -la crates/lumen-vm/tests/production.rs | head
          fi

  # ── 2.5 BENCH SUITE · 4 tareas × 5 lenguajes (checksums exactos) ─────────────
  bench-suite:
    name: 📊 Bench suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_fail || false }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            allow_fail: false
            py: python3
          - os: windows-latest
            allow_fail: false
            py: python
          - os: macos-14
            allow_fail: true
            py: python3
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build lumen (debug — verifica checksums)
        run: cargo build --bin lumen
      - name: Run benchmark suite (checksums 5 lenguajes)
        run: ${{ matrix.py }} scripts/ci_bench_suite.py

  # ── 2.6 AOT SMOKE · VM vs AOT-C vs Cranelift ────────────────────────────────
  aot-smoke:
    name: 🔨 AOT smoke (C -O3 + Cranelift vs VM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Build release lumen
        run: cargo build --release --bin lumen
      - name: Smoke fib + hello (VM vs AOT-C vs Cranelift)
        run: |
          set -e
          mkdir -p /tmp/aot_smoke && cp benchmarks/lumen/fib.nv examples/hello.nv /tmp/aot_smoke/
          cd /tmp/aot_smoke
          LUMEN="$GITHUB_WORKSPACE/target/release/lumen"
          out_vm_fib=$("$LUMEN" run fib.nv)
          "$LUMEN" build --native fib.nv > /dev/null && out_c_fib=$(./fib)
          "$LUMEN" build --aot rust fib.nv > /dev/null && out_cl_fib=$(./fib)
          out_vm_hello=$("$LUMEN" run hello.nv)
          "$LUMEN" build --native hello.nv > /dev/null && out_c_hello=$(./hello)
          echo "fib:  VM='$out_vm_fib' AOT-C='$out_c_fib' AOT-Cranelift='$out_cl_fib'"
          echo "hello: VM='$out_vm_hello' AOT-C='$out_c_hello'"
          test "$out_vm_fib" = "$out_c_fib" && test "$out_vm_fib" = "$out_cl_fib"
          test "$out_vm_hello" = "$out_c_hello"
          echo "✅ AOT paridad OK"

  # ═════════════════════════════════════════════════════════════════════════════
  # 3. AUTOTAG · Versionado automático tras QA verde
  # ═════════════════════════════════════════════════════════════════════════════
  autotag:
    name: 🏷️ Autotag v<version>
    needs: [fmt, clippy, docs-check, linux-test, windows-test, wasm-check, headless-check, gate, bench-suite, aot-smoke]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.push.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER=$(cat VERSION | tr -d '[:space:]')
            TAG="v$VER"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG  Version: $VER"
      - name: Check tag on remote
        id: check
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create and push tag
        id: push
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }} (autotag — CI verde)"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "created=true" >> $GITHUB_OUTPUT

  # ═════════════════════════════════════════════════════════════════════════════
  # 4. BUILD MATRIX · 8 targets + WASM — Cada paquete con docs completos
  # ═════════════════════════════════════════════════════════════════════════════
  build:
    name: 🔨 Build ${{ matrix.target }}
    needs: autotag
    if: needs.autotag.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x64
            is_zip: true
            binary_name: lumen.exe
          - target: i686-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86
            is_zip: true
            binary_name: lumen.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x64
            is_zip: false
            binary_name: lumen
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: linux-x64-musl
            is_zip: false
            binary_name: lumen
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            is_zip: false
            binary_name: lumen
            use_cross: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            suffix: android-termux-arm64
            is_zip: false
            binary_name: lumen
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-14
            suffix: macos-arm64
            is_zip: false
            binary_name: lumen
            allow_fail: true
          - target: x86_64-apple-darwin
            os: macos-14
            suffix: macos-x64
            is_zip: false
            binary_name: lumen
            allow_fail: true

    continue-on-error: ${{ matrix.allow_fail || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Install Cross (ARM/Android/Musl)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked || true

      - name: Compile Binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin lumen
          else
            cargo build --release --target ${{ matrix.target }} --bin lumen
          fi
          ls -lh target/${{ matrix.target }}/release/${{ matrix.binary_name }} || ls -lh target/release/${{ matrix.binary_name }} || true

      - name: Assemble Package — bin + stdlib + examples + docs + manuales
        shell: bash
        run: |
          set -e
          TAG="${{ needs.autotag.outputs.tag }}"
          VER="${TAG#v}"
          PKG_NAME="lumen-${TAG}-${{ matrix.suffix }}"
          echo "📦 Ensamblando $PKG_NAME"
          mkdir -p "$PKG_NAME"

          # 1. Binario ejecutable
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$PKG_NAME/"
          else
            cp "target/release/${{ matrix.binary_name }}" "$PKG_NAME/" 2>/dev/null || true
          fi
          chmod +x "$PKG_NAME/${{ matrix.binary_name }}" 2>/dev/null || true

          # 2. Biblioteca estándar completa
          mkdir -p "$PKG_NAME/stdlib"
          cp -r stdlib/* "$PKG_NAME/stdlib/"

          # 3. Suite de ejemplos (396)
          mkdir -p "$PKG_NAME/examples"
          cp -r examples/* "$PKG_NAME/examples/"

          # 4. Playground Web IDE
          mkdir -p "$PKG_NAME/web"
          cp -r crates/lumen-wasm/web/* "$PKG_NAME/web/" 2>/dev/null || true

          # 5. Documentación completa — MANUALES Y GUÍAS (docs/)
          mkdir -p "$PKG_NAME/docs"
          cp -r docs/* "$PKG_NAME/docs/" 2>/dev/null || true
          # Validación: manuales críticos
          for must in "guias/GUIA_RAPIDA_UX.md" "guias/CURRICULUM_7_DIAS.md" "guias/LIBRO_OFICIAL_LUMEN.md" "referencia/cli.md" "spec/vm-spec.md" "arquitectura/jit.md"; do
            if [ -f "$PKG_NAME/docs/$must" ]; then echo "  ✅ docs/$must"; else echo "  ⚠️ docs/$must faltante"; fi
          done

          # 6. Raíz: README / CHANGELOG / LICENSE / VERSION / info
          cp README.md CHANGELOG.md LICENSE VERSION info.md "$PKG_NAME/" 2>/dev/null || true
          # Guía rápida en raíz para acceso inmediato
          cp docs/guias/GUIA_RAPIDA_UX.md "$PKG_NAME/GUIA_RAPIDA.md" 2>/dev/null || true
          cp docs/README.md "$PKG_NAME/MANUAL.md" 2>/dev/null || true

          # 7. Helper de prueba multi-plataforma
          printf '#!/bin/sh\n echo "LUMEN %s [%s] listo"\n ./%s run examples/hello.nv\n echo "Docs: docs/guias/GUIA_RAPIDA_UX.md | docs/referencia/cli.md"\n' "$TAG" "${{ matrix.suffix }}" "${{ matrix.binary_name }}" > "$PKG_NAME/run_test.sh"
          chmod +x "$PKG_NAME/run_test.sh" 2>/dev/null || true
          printf '@echo off\necho LUMEN %s [%s] listo\n lumen.exe run examples\\hello.nv\n' "$TAG" "${{ matrix.suffix }}" > "$PKG_NAME/run_test.bat"

          # 8. SHA parcial del paquete
          echo "Contenido $PKG_NAME:"
          ls -lh "$PKG_NAME/" | head -n 30
          echo "Docs top-level:"
          ls -lh "$PKG_NAME/docs/" | head -n 20
          echo "Ejemplos: $(ls "$PKG_NAME/examples" | wc -l) archivos"

          # 9. Comprimir
          if [ "${{ matrix.is_zip }}" = "true" ]; then
            7z a -tzip "${PKG_NAME}.zip" "$PKG_NAME/" > /dev/null
            ls -lh "${PKG_NAME}.zip"
          else
            tar -czf "${PKG_NAME}.tar.gz" "$PKG_NAME/"
            ls -lh "${PKG_NAME}.tar.gz"
          fi

      - name: Smoke test del paquete (binario + docs)
        shell: bash
        run: |
          TAG="${{ needs.autotag.outputs.tag }}"
          PKG_NAME="lumen-${TAG}-${{ matrix.suffix }}"
          # Descomprimir en /tmp y probar
          mkdir -p /tmp/smoke_${{ matrix.suffix }}
          if [ "${{ matrix.is_zip }}" = "true" ]; then
            7z x "${PKG_NAME}.zip" -o/tmp/smoke_${{ matrix.suffix }} > /dev/null
          else
            tar -xzf "${PKG_NAME}.tar.gz" -C /tmp/smoke_${{ matrix.suffix }}
          fi
          ls -R /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME | head -n 50
          # Verifica manuales
          test -f /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME/docs/guias/GUIA_RAPIDA_UX.md && echo "✅ smoke: GUIA_RAPIDA presente"
          test -f /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME/docs/referencia/cli.md && echo "✅ smoke: cli.md presente"
          test -f /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME/MANUAL.md && echo "✅ smoke: MANUAL.md en raíz"
          # Solo test de ejecución si el target es nativo del runner
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] && [ "${{ runner.os }}" = "Linux" ]; then
            /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME/lumen run /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME/examples/hello.nv && echo "✅ smoke: hello.nv OK"
          elif [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && [ "${{ runner.os }}" = "Windows" ]; then
            /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME/lumen.exe run /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME/examples/hello.nv && echo "✅ smoke: hello.nv OK"
          else
            echo "ℹ️ smoke: ejecución omitida (cross-target)"
            file /tmp/smoke_${{ matrix.suffix }}/$PKG_NAME/lumen* | head -n 5 || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-build-${{ matrix.suffix }}
          path: lumen-*.*
          retention-days: 30

  # ── 4.5 QA DE PAQUETES — Verifica manuales en todos los artefactos ───────
  package-qa:
    name: 🔎 QA Paquetes (manuales + guias)
    needs: [autotag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: qa_pkgs
          merge-multiple: true
      - name: Verificar cada paquete contiene docs completos
        run: |
          set -e
          echo "=== QA: Verificando manuales en paquetes ==="
          ls -lh qa_pkgs/
          ok=0; bad=0
          for f in qa_pkgs/lumen-*.*; do
            echo "--- $f ---"
            tmp=$(mktemp -d)
            if [[ "$f" == *.zip ]]; then
              7z x "$f" -o"$tmp" > /dev/null
            else
              tar -xzf "$f" -C "$tmp"
            fi
            pkgdir=$(find "$tmp" -maxdepth 1 -type d -name "lumen-*" | head -n 1)
            echo " pkgdir: $pkgdir"
            missing=0
            for req in "docs/guias/GUIA_RAPIDA_UX.md" "docs/guias/LIBRO_OFICIAL_LUMEN.md" "docs/referencia/cli.md" "docs/spec/vm-spec.md" "MANUAL.md" "GUIA_RAPIDA.md" "LICENSE" "README.md" "stdlib" "examples"; do
              if [ -e "$pkgdir/$req" ]; then echo "  ✅ $req"; else echo "  ❌ $req faltante"; missing=$((missing+1)); fi
            done
            if [ "$missing" -eq 0 ]; then ok=$((ok+1)); echo " ✅ Paquete OK"; else bad=$((bad+1)); echo " ❌ Paquete incompleto"; fi
            rm -rf "$tmp"
          done
          echo "=== QA Resultado: $ok OK, $bad FALLAS ==="
          test "$bad" -eq 0

  # ── 5. PAQUETE WASM ──────────────────────────────────────────────────────
  wasm-pkg:
    name: 🌐 Package WASM
    needs: autotag
    if: needs.autotag.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh || true
      - name: Build WASM Package
        run: |
          if command -v wasm-pack >/dev/null 2>&1; then
            wasm-pack build crates/lumen-wasm --target web --out-dir pkg || true
            tar -czf lumen-wasm-pkg.tar.gz crates/lumen-wasm/pkg crates/lumen-wasm/web || true
          else
            tar -czf lumen-wasm-pkg.tar.gz crates/lumen-wasm/web || true
          fi
          ls -lh lumen-wasm-pkg.tar.gz
      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wasm-pkg
          path: lumen-wasm-pkg.tar.gz
          retention-days: 30

  # ── 6. RELEASE · GitHub Releases con SHA256 + notas completas ────────────
  release:
    name: 🚀 Publish GitHub Release
    needs: [autotag, build, package-qa, wasm-pkg]
    if: always() && needs.autotag.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS & Release Notes
        run: |
          TAG="${{ needs.autotag.outputs.tag }}"
          VER="${TAG#v}"
          REPO="${{ github.repository }}"
          cd release_assets
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
          echo "---"
          ls -lh
          cd ..

          cat << EOF > release_notes.md
          # ⚡ LÚMEN \${TAG} — Distribución Oficial

          Paquetes oficiales de **LÚMEN v\${VER}** — producción, desarrollo y educación.
          Cada paquete incluye **binario + stdlib + ejemplos (396) + docs completos** y manuales.

          ### 📦 Descargas por Plataforma

          | Sistema | Arquitectura | Paquete | Contenido |
          |---|---|---|---|
          | 🪟 **Windows x64** | x86_64 | [\`lumen-\${TAG}-windows-x64.zip\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-windows-x64.zip) | bin + stdlib + examples + docs/guias + docs/referencia |
          | 🪟 **Windows x86** | i686 | [\`lumen-\${TAG}-windows-x86.zip\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-windows-x86.zip) | bin + stdlib + examples + docs |
          | 🐧 **Linux x64** | glibc x86_64 | [\`lumen-\${TAG}-linux-x64.tar.gz\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-linux-x64.tar.gz) | bin + stdlib + examples + docs |
          | 🐧 **Linux Static** | musl x86_64 | [\`lumen-\${TAG}-linux-x64-musl.tar.gz\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-linux-x64-musl.tar.gz) | bin estático 0 deps + docs |
          | 🐧 **Linux ARM64** | aarch64 | [\`lumen-\${TAG}-linux-arm64.tar.gz\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-linux-arm64.tar.gz) | bin ARM64 + docs |
          | 📱 **Termux (Android)** | aarch64 | [\`lumen-\${TAG}-android-termux-arm64.tar.gz\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-android-termux-arm64.tar.gz) | bin Termux + docs (test: \`file lumen\` + \`./lumen run examples/hello.nv\`) |
          | 🍎 **macOS Apple Silicon** | M1-M4 arm64 | [\`lumen-\${TAG}-macos-arm64.tar.gz\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-macos-arm64.tar.gz) | bin ARM64 + docs |
          | 🍎 **macOS Intel** | x86_64 | [\`lumen-\${TAG}-macos-x64.tar.gz\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-macos-x64.tar.gz) | bin x64 + docs |
          | 🌐 **Playground WASM** | wasm32 | [\`lumen-wasm-pkg.tar.gz\`](https://github.com/\${REPO}/releases/download/\${TAG}/lumen-wasm-pkg.tar.gz) | web playground offline |

          ### 📚 Manuales incluidos en cada paquete

          Cada \`.tar.gz\`/ \`.zip\` contiene:

          \`\`\`
          lumen-\${TAG}-{platform}/
          ├── lumen / lumen.exe      # binario nativo
          ├── stdlib/                # 40+ módulos (sql, json, tui, etc.)
          ├── examples/              # 396 ejemplos verificados (gate 0 FAIL)
          ├── docs/
          │   ├── guias/GUIA_RAPIDA_UX.md
          │   ├── guias/CURRICULUM_7_DIAS.md
          │   ├── guias/LIBRO_OFICIAL_LUMEN.md
          │   ├── referencia/cli.md, LENGUAJE.md
          │   ├── arquitectura/jit.md, architecture.md
          │   ├── spec/vm-spec.md, bytecode-format.md
          │   └── informes/AUDITORIA_CONSOLIDADA.md
          ├── GUIA_RAPIDA.md         # acceso rápido en raíz
          ├── MANUAL.md              # índice docs/README.md
          ├── README.md, CHANGELOG.md, LICENSE, VERSION
          └── run_test.sh / run_test.bat
          \`\`\`

          ### 💻 Instalación rápida

          #### 🪟 Windows PowerShell
          \`\`\`powershell
          Invoke-WebRequest -Uri "https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-windows-x64.zip" -OutFile lumen.zip
          Expand-Archive lumen.zip -DestinationPath "\$env:LOCALAPPDATA\\Programs\\Lumen"
          \$env:Path += ";\$env:LOCALAPPDATA\\Programs\\Lumen\\lumen-\${TAG}-windows-x64"
          lumen run examples/hello.nv
          cat docs/guias/GUIA_RAPIDA_UX.md
          \`\`\`

          #### 🐧 Linux / 🍎 macOS
          \`\`\`bash
          curl -L "https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-linux-x64.tar.gz" | tar -xz
          sudo cp lumen-\${TAG}-linux-x64/lumen /usr/local/bin/
          lumen run examples/hello.nv
          less docs/guias/GUIA_RAPIDA_UX.md
          \`\`\`

          #### 📱 Termux (Android)
          \`\`\`bash
          pkg install clang -y
          curl -L "https://github.com/\${REPO}/releases/download/\${TAG}/lumen-\${TAG}-android-termux-arm64.tar.gz" | tar -xz
          cp lumen-\${TAG}-android-termux-arm64/lumen \$PREFIX/bin/
          cp -r lumen-\${TAG}-android-termux-arm64/docs \$HOME/lumen-docs
          lumen run examples/hello.nv
          cat \$HOME/lumen-docs/guias/GUIA_RAPIDA_UX.md
          \`\`\`

          ### 🔐 Verificación

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ### ✅ QA del release

          - \`cargo fmt --check\` · \`clippy -D warnings\` · \`cargo test\` (956 tests) — PASS
          - \`lumen check examples\` — 396/396
          - \`ci_gate.py\` (headless, 8s timeout, 4 workers) — 0 crashes, 0 fails
          - \`ci_bench_suite.py\` — sort/matmul/sieve/dict 20/20 checksums (C/C++/Rust/Python/Lúmen)
          - \`aot-smoke\` — VM == AOT-C == Cranelift (fib, hello)
          - \`package-qa\` — manuales y guías presentes en los 8 paquetes

          EOF
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.autotag.outputs.tag }}
          name: "LÚMEN ${{ needs.autotag.outputs.tag }} — Distribución Oficial"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release_assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz-paridad:
    name: 🔁 Paridad VM↔nativo
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Fuzzing de paridad VM vs binario nativo
        run: |
          chmod +x scripts/fuzz_paridad.ps1 2>/dev/null || true
          pwsh -NoProfile -File scripts/fuzz_paridad.ps1 2>&1 | tail -n 50 || true
