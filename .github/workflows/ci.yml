name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all -- -D warnings

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets --verbose
      - run: cargo test --all --verbose -- --skip test_aes

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets --verbose
      - run: cargo test --all --verbose -- --skip test_aes

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets --verbose
      - run: cargo test --all --verbose

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p lumen-wasm --target wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: cargo check -p lumen-wasm --target wasm32-wasip1 --no-default-features --features wasi

  # ── AUTOTAG ─────────────────────────────────────────────
  # Crea el tag v<version> (desde VERSION) SOLO cuando:
  #   • es un push a master/main (no PR)
  #   • todos los checks de calidad pasaron
  #   • el tag aún no existe en el remoto
  # El push del tag dispara release.yml (builds + GitHub Release).
  autotag:
    name: Autotag v<version>
    needs: [fmt, clippy, linux, macos, windows, wasm-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT
      - name: Check tag on remote
        id: check
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }} (autotag — todos los checks de CI pasaron)"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Log
        run: |
          echo "VERSION=${{ steps.version.outputs.version }}"
          echo "TAG=${{ steps.version.outputs.tag }} (exists=${{ steps.check.outputs.exists }})"
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "El tag ya existe en el remoto — no se recrea (release.yml se encarga)."
          fi