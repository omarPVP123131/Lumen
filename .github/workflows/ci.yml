name: CI

# Verificación en cada push y PR. Deliberadamente NO publica nada: el release
# vive en release.yml. Mezclarlos hace que un test rojo parezca un fallo de
# publicación y que un fallo de publicación parezca un test roto.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  # Un push nuevo cancela la ejecución anterior de la misma rama.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lo barato primero: si el formato o clippy fallan, no gastamos 3 matrices.
  lint:
    name: Formato y clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Pruebas (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false # queremos ver si algo falla SOLO en Windows
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Suite completa
        run: cargo test --release --workspace

  # ── Los fuzzers y los ejemplos son la red que pilló BUG-147..153. Corren en
  # Linux, que es donde están escritos los scripts, y sin bloquear la matriz.
  fuzzers:
    name: Fuzzers y ejemplos
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar
        run: cargo build --release

      # `allex.sh` ya distingue los ejemplos interactivos y los windows-only,
      # que no son fallos del lenguaje. Reutilizarlo evita mantener dos
      # criterios distintos de "ejemplo roto".
      - name: Ejemplos (todos deben ejecutarse)
        run: bash gen/allex.sh | tee /tmp/allex.log
      - name: Ningún ejemplo falla
        run: grep -qE "fallan=0( |$)" /tmp/allex.log

      - name: stdlib — todos los módulos deben pasar `check`
        run: |
          err=0
          for f in stdlib/*.nv; do
            ./target/release/lumen check "$f" >/dev/null 2>&1 || { echo "ERROR: $f"; err=$((err+1)); }
          done
          echo "módulos con error: $err"
          test "$err" -eq 0

      - name: Fuzzer diferencial — structs, listas y `prestado mut`
        run: python3 gen/fuzz6.py 320 && bash gen/fz10.sh | tee /tmp/fz10.log
      - name: Sin divergencias (fz10)
        run: grep -q "oraculo=0 diffs=0 crashes=0" /tmp/fz10.log

      - name: Fuzzer de closures
        run: python3 gen/fuzz7.py 240 && bash gen/fz11.sh | tee /tmp/fz11.log
      - name: Sin divergencias (fz11)
        run: grep -q "oraculo=0 diffs=0 crashes=0" /tmp/fz11.log

      - name: Fuzzer de rechazo — el código inválido debe rechazarse
        run: python3 gen/fuzz8.py 120 && bash gen/fz12.sh | tee /tmp/fz12.log
      - name: Nada aceptado por error (fz12)
        run: grep -q "acepta_run=0 acepta_check=0 ejecuta_cuerpo=0 acepta_tool=0" /tmp/fz12.log

  # ── BUG-152: un binario instalado fuera del repo no encontraba la stdlib.
  # Esta prueba lo reproduce SIEMPRE, para que no pueda volver en silencio.
  instalacion-limpia:
    name: Instalación limpia (sin repo alrededor)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: El binario, solo, en un directorio ajeno
        run: |
          # Nada de stdlib en disco: si el import funciona, es por la embebida.
          mkdir -p /tmp/inst /tmp/proyecto
          cp target/release/lumen /tmp/inst/
          cd /tmp/proyecto
          printf 'importar "texto";\nfuncion vacio main() { imprimir(texto_longitud("hola")); }\n' > hola.nv
          salida=$(/tmp/inst/lumen run hola.nv)
          echo "salida: $salida"
          test "$salida" = "4"

      - name: Los 69 módulos importables, sin stdlib en disco
        run: |
          mkdir -p /tmp/inst2 && cp target/release/lumen /tmp/inst2/
          cd /tmp && ko=0
          for f in "$GITHUB_WORKSPACE"/stdlib/*.nv; do
            n=$(basename "$f" .nv)
            printf 'importar "%s";\nfuncion vacio main() { imprimir(1); }\n' "$n" > /tmp/m.nv
            /tmp/inst2/lumen run /tmp/m.nv >/dev/null 2>&1 || ko=$((ko+1))
          done
          echo "módulos NO importables: $ko"
          test "$ko" -eq 0

      - name: "`build --native` sin compilador de C falla con un mensaje útil"
        run: |
          cp target/release/lumen /tmp/inst/
          cd /tmp/proyecto
          printf 'funcion vacio main() { imprimir(42); }\n' > n.nv
          # PATH vacío: no hay gcc ni clang.
          set +e
          salida=$(env -i PATH=/nonexistent HOME=/tmp /tmp/inst/lumen build n.nv --native -o /tmp/proyecto/nbin 2>&1)
          rc=$?
          set -e
          echo "$salida"
          test "$rc" -ne 0                                  # debe fallar
          test ! -f /tmp/proyecto/nbin                      # sin binario a medias
          echo "$salida" | grep -qi "compilador de C"       # y explicando por qué
