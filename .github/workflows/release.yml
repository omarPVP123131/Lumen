name: Release

# Se dispara SOLO cuando existe un tag v* — creado automáticamente por el
# job `autotag` de ci.yml después de que todos los checks pasen, o de forma
# manual (workflow_dispatch). Los binarios se construyen desde el tag
# (commit exacto que pasó CI), no desde el estado del branch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a releasear (ej: v2.4.1)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve tag + version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        name: Resolve from tag or input
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.tag }}" | sed 's/^v//' >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF_NAME}" | sed 's/^v//' >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare asset
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mkdir -p lumen-${{ matrix.target }}
          cp lumen${{ matrix.ext }} lumen-${{ matrix.target }}/
          cp ../../../README.md lumen-${{ matrix.target }}/
          cp ../../../CHANGELOG.md lumen-${{ matrix.target }}/
          cp ../../../LICENSE* lumen-${{ matrix.target }}/ 2>/dev/null || true
          cp ../../../VERSION lumen-${{ matrix.target }}/ 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip ../../../lumen-${{ matrix.target }}.zip lumen-${{ matrix.target }}/
          else
            tar czf ../../../lumen-${{ matrix.target }}.tar.gz lumen-${{ matrix.target }}/
          fi
      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.target }}
          path: lumen-${{ matrix.target }}.*
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [version, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract changelog section for ${{ needs.version.outputs.version }}
        run: |
          VER="${{ needs.version.outputs.version }}"
          echo "Generando notas para v$VER ..."
          awk -v ver="$VER" '/^## / { if (found) exit; if ($0 ~ "v" ver || $0 ~ ver) found=1; next } found' CHANGELOG.md > release_notes.md
          # Fallback: si no hay sección exacta, notas genéricas
          if [ ! -s release_notes.md ]; then
            echo "Release LÚMEN v$VER — autotag tras CI verde (fmt, clippy -D warnings, tests 3 OS, wasm)." > release_notes.md
            echo "" >> release_notes.md
            echo "Assets multi-plataforma (linux/macos/windows x64, macos arm64) incluidos." >> release_notes.md
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: LÚMEN ${{ needs.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}