name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      force_tag:
        description: "Forzar tag (ej: v2.0.0)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Detect version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version from Cargo.toml
        id: get_version
        run: |
          if [ -n "${{ inputs.force_tag }}" ]; then
            TAG="${{ inputs.force_tag }}"
          else
            VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            TAG="v$VER"
          fi
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.get_version.outputs.tag }}" -m "Release ${{ steps.get_version.outputs.tag }}"
          git push origin "${{ steps.get_version.outputs.tag }}"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare asset
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mkdir -p lumen-${{ matrix.target }}
          cp lumen${{ matrix.ext }} lumen-${{ matrix.target }}/
          cp ../../../README.md lumen-${{ matrix.target }}/
          cp ../../../CHANGELOG.md lumen-${{ matrix.target }}/
          cp ../../../LICENSE* lumen-${{ matrix.target }}/ 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip ../../../lumen-${{ matrix.target }}.zip lumen-${{ matrix.target }}/
          else
            tar czf ../../../lumen-${{ matrix.target }}.tar.gz lumen-${{ matrix.target }}/
          fi
      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.target }}
          path: lumen-${{ matrix.target }}.*
          retention-days: 7

  release:
    name: Create Release
    needs: [version, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract changelog section
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VER="${{ needs.version.outputs.version }}"
          awk -v ver="$VER" '/^## / { if (found) exit; if ($0 ~ ver || $0 ~ "v" ver) found=1; next } found' CHANGELOG.md > release_notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: LÚMEN ${{ needs.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
